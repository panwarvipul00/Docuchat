# Production stack for a single server (e.g. an Oracle Cloud Always Free VM).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Caddy is the only service exposed to the internet. It gets a free HTTPS
# certificate for $DOMAIN and routes /api, /admin and /static to Django and
# everything else to Next.js, so the browser sees one origin (no CORS needed).
# See docs/DEPLOY.md.

# Settings shared by the API and the Celery worker. Values derived from DOMAIN
# are computed here so .env.prod only needs secrets and API keys.
x-backend-env: &backend-env
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env.prod}
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  DJANGO_BEHIND_HTTPS_PROXY: "True"
  CORS_ALLOWED_ORIGINS: https://${DOMAIN}
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/docuchat
  REDIS_URL: redis://redis:6379/0
  MEDIA_ROOT: /app/media
  # Caddy is the one proxy in front: per-IP rate limits read the client IP
  # from X-Forwarded-For instead of seeing every request as coming from Caddy.
  DJANGO_NUM_PROXIES: "1"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docuchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment: *backend-env
    # Migrate and collect static files on every start, then run the Dockerfile's
    # gunicorn command (gthread workers, so SSE streams don't block requests).
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --worker-class gthread --threads 8 --timeout 120"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment: *backend-env
    # Two parallel ingestion jobs keeps PDF parsing within a small VM's RAM.
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - media:/app/media  # same volume as backend: the worker reads uploads from it
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Baked into the JS bundle at build time; same origin as the site.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data  # TLS certificates; keep it so restarts don't re-issue
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
